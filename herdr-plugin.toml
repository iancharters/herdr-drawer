id = "herdr-drawer"
name = "Herdr Terminal Drawer"
version = "0.2.2"
min_herdr_version = "0.7.0"
description = "Persistent, profile-driven utility panes (drawer/sidecar) scoped to each herdr tab"
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "toggle"
title = "Toggle terminal drawer"
contexts = ["global"]
command = ["bin/herdr-drawer", "toggle"]

[[actions]]
id = "open"
title = "Open terminal drawer"
contexts = ["global"]
command = ["bin/herdr-drawer", "open"]

[[actions]]
id = "close"
title = "Close terminal drawer"
contexts = ["global"]
command = ["bin/herdr-drawer", "close"]

[[actions]]
id = "split-right"
title = "Split drawer pane right"
contexts = ["global"]
command = ["bin/herdr-drawer", "split", "--direction", "right"]

[[actions]]
id = "split-down"
title = "Split drawer pane down"
contexts = ["global"]
command = ["bin/herdr-drawer", "split", "--direction", "down"]

[[actions]]
id = "setup"
title = "Setup Neovim integration"
contexts = ["global"]
command = ["bin/herdr-drawer", "setup"]

[[actions]]
id = "cleanup-workspace"
title = "Cleanup utility sessions in current workspace"
contexts = ["global"]
command = ["bin/herdr-drawer", "cleanup", "--scope", "workspace"]

[[actions]]
id = "cleanup-all"
title = "Cleanup all utility sessions"
contexts = ["global"]
command = ["bin/herdr-drawer", "cleanup", "--scope", "all"]

[[panes]]
id = "drawer"
title = "Drawer"
description = "Persistent bottom terminal drawer pane"
platforms = ["linux", "macos"]
placement = "split"
command = ["bin/herdr-drawer", "attach"]

[[panes]]
id = "setup"
title = "Herdr Drawer Setup"
description = "Interactive Neovim configuration installer"
platforms = ["linux", "macos"]
placement = "popup"
width = "70%"
height = "35%"
command = ["bin/herdr-drawer", "setup", "--popup"]
